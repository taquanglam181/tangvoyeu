<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gửi Vợ Yêu - 20/10 Yêu Thương</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Canvas hiệu ứng 2D phẳng cánh hoa và bụi sao rơi nhẹ nhàng -->
  <canvas id="canvas-bg"></canvas>

  <!-- Nút điều khiển âm thanh tinh tế -->
  <div class="music-control-panel">
    <button class="audio-toggle" id="audio-btn" type="button" title="Bật / Tạm dừng bài hát">
      <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>
      </svg>
      <span class="text" id="audio-status">Thế Giới Của Anh</span>
    </button>
  </div>

  <!-- Audio Element phát bài hát cố định -->
  <audio id="bg-audio" loop preload="auto">
    <source src="assets/music.mp3" type="audio/mpeg">
    <source src="assets/The%20gioi%20cua%20anh.mp3" type="audio/mpeg">
  </audio>

  <!-- GIAI ĐOẠN 1: BÔNG HOA HỒNG THẬT & HƯỚNG DẪN MINIMALIST PHẲNG -->
  <main class="scene-initial" id="scene-initial">
    <div class="rose-stage" id="rose-trigger" title="Chạm vào đóa hoa để mở món quà">
      
      <!-- Hào quang phẳng 2D dịu nhẹ phía sau hoa -->
      <div class="flat-glow"></div>
      
      <!-- Khung tròn phẳng chứa đóa hoa hồng thật -->
      <div class="rose-frame-flat">
        <img class="real-rose-img" src="assets/realistic-rose.jpg" alt="Đóa hoa hồng gửi vợ yêu">
      </div>

      <!-- Vòng viền mảnh 2D bao quanh hoa -->
      <div class="minimal-circle-accent"></div>
    </div>

    <!-- Hướng dẫn click hoàn toàn phẳng, Minimalist -->
    <div class="hint-box" id="hint-box">
      <!-- Icon chạm tay 2D Vector phẳng -->
      <div class="touch-icon-wrap">
        <svg class="touch-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a4 4 0 0 0-4 4v7.5a1.5 1.5 0 0 1-3 0V11a1.5 1.5 0 0 0-3 0v4.5A7.5 7.5 0 0 0 9.5 23h5a7.5 7.5 0 0 0 7.5-7.5V9.5a1.5 1.5 0 0 0-3 0V12"></path>
          <path d="M12 6V3.5a1.5 1.5 0 0 1 3 0V10"></path>
          <path d="M15 6V4.5a1.5 1.5 0 0 1 3 0V11"></path>
        </svg>
      </div>
      
      <p class="hint-title">
        Chạm vào đoá hoa nhé em yêu
        <svg class="star-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"/>
        </svg>
      </p>
      <p class="hint-sub">Một bất ngờ ngọt ngào đang chờ em hé mở...</p>
    </div>
  </main>

  <!-- GIAI ĐOẠN 2: THIỆP & KHUNG ẢNH VỢ CỐ ĐỊNH -->
  <section class="scene-wishes" id="scene-wishes">
    <div class="card-wrapper" id="card-wrapper">
      
      <!-- Huy hiệu ngày 20/10 phẳng thanh lịch -->
      <div class="card-header-badge">
        <span>20.10 • Vietnamese Women's Day</span>
      </div>

      <!-- Khung ảnh của vợ cố định -->
      <div class="photo-section">
        <div class="photo-frame-outer" id="photo-frame">
          <div class="photo-frame-inner">
            <img id="wife-photo" src="assets/wife-sample.jpg" alt="Vợ Yêu Của Anh">
          </div>
        </div>
      </div>

      <!-- Tiêu đề và lời chúc phẳng thanh nhã -->
      <div class="wishes-content">
        <h1 class="main-title">
          Chúc Mừng 20-10 Vợ Yêu
          <svg class="title-heart" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </h1>
        <h2 class="sub-greeting">Dành tặng người phụ nữ tuyệt vời nhất trong trái tim anh</h2>
        
        <div class="letter-box">
          <p class="typewriter-text" id="wish-text"></p>
        </div>

        <div class="signature">
          <span class="sign-tag">Yêu em nhiều hơn mỗi ngày,</span>
          <span class="sign-name">Chồng của em</span>
        </div>

        <!-- Các nút bấm phẳng Minimal -->
        <div class="card-actions">
          <button class="btn btn-love" id="btn-burst-love" type="button">
            <svg class="btn-svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            <span>Thả ngàn yêu thương</span>
          </button>
          
          <button class="btn btn-replay" id="btn-replay" type="button">
            <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            <span>Ngắm lại đóa hoa</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
